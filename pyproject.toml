[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for experiments"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "peft>=0.21.2",
    "pyarrow>=25.0.1",
    "scipy>=1.15.3",
    "statsmodels>=0.15.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = false
link-mode = "symlink"
